naftiko: 1.0.0-alpha2
info:
  label: Avaloq Banking API — Accounts
  description: 'Avaloq Banking API — Accounts. 2 operations. Lead operation: Avaloq List Bank Accounts. Self-contained Naftiko
    capability covering one Avaloq business surface.'
  tags:
  - Avaloq
  - Accounts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AVALOQ_API_KEY: AVALOQ_API_KEY
capability:
  consumes:
  - type: http
    namespace: banking-accounts
    baseUri: https://api.avaloq.com
    description: Avaloq Banking API — Accounts business capability. Self-contained, no shared references.
    resources:
    - name: v1-accounts
      path: /v1/accounts
      operations:
      - name: listaccounts
        method: GET
        description: Avaloq List Bank Accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: customerId
          in: query
          type: string
          description: Filter by customer ID
        - name: status
          in: query
          type: string
          description: Filter by account status
        - name: limit
          in: query
          type: integer
          description: Number of results per page
        - name: offset
          in: query
          type: integer
          description: Pagination offset
    - name: v1-accounts-accountId
      path: /v1/accounts/{accountId}
      operations:
      - name: getaccount
        method: GET
        description: Avaloq Get Bank Account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountId
          in: path
          type: string
          description: Account ID
          required: true
    authentication:
      type: bearer
      token: '{{env.AVALOQ_API_KEY}}'
  exposes:
  - type: rest
    namespace: banking-accounts-rest
    port: 8080
    description: REST adapter for Avaloq Banking API — Accounts. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v1/accounts
      name: v1-accounts
      description: REST surface for v1-accounts.
      operations:
      - method: GET
        name: listaccounts
        description: Avaloq List Bank Accounts
        call: banking-accounts.listaccounts
        with:
          customerId: rest.customerId
          status: rest.status
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/accounts/{accountid}
      name: v1-accounts-accountid
      description: REST surface for v1-accounts-accountId.
      operations:
      - method: GET
        name: getaccount
        description: Avaloq Get Bank Account
        call: banking-accounts.getaccount
        with:
          accountId: rest.accountId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: banking-accounts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Avaloq Banking API — Accounts. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: avaloq-list-bank-accounts
      description: Avaloq List Bank Accounts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: banking-accounts.listaccounts
      with:
        customerId: tools.customerId
        status: tools.status
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
    - name: avaloq-get-bank-account
      description: Avaloq Get Bank Account
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: banking-accounts.getaccount
      with:
        accountId: tools.accountId
      outputParameters:
      - type: object
        mapping: $.
