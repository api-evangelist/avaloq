naftiko: 1.0.0-alpha2
info:
  label: Avaloq Banking API — Customers
  description: 'Avaloq Banking API — Customers. 3 operations. Lead operation: Avaloq List Customers. Self-contained Naftiko
    capability covering one Avaloq business surface.'
  tags:
  - Avaloq
  - Customers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AVALOQ_API_KEY: AVALOQ_API_KEY
capability:
  consumes:
  - type: http
    namespace: banking-customers
    baseUri: https://api.avaloq.com
    description: Avaloq Banking API — Customers business capability. Self-contained, no shared references.
    resources:
    - name: v1-customers
      path: /v1/customers
      operations:
      - name: listcustomers
        method: GET
        description: Avaloq List Customers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: limit
          in: query
          type: integer
          description: Results per page
        - name: offset
          in: query
          type: integer
          description: Pagination offset
      - name: createcustomer
        method: POST
        description: Avaloq Create Customer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-customers-customerId
      path: /v1/customers/{customerId}
      operations:
      - name: getcustomer
        method: GET
        description: Avaloq Get Customer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: customerId
          in: path
          type: string
          description: Customer ID
          required: true
    authentication:
      type: bearer
      token: '{{env.AVALOQ_API_KEY}}'
  exposes:
  - type: rest
    namespace: banking-customers-rest
    port: 8080
    description: REST adapter for Avaloq Banking API — Customers. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/customers
      name: v1-customers
      description: REST surface for v1-customers.
      operations:
      - method: GET
        name: listcustomers
        description: Avaloq List Customers
        call: banking-customers.listcustomers
        with:
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcustomer
        description: Avaloq Create Customer
        call: banking-customers.createcustomer
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/customers/{customerid}
      name: v1-customers-customerid
      description: REST surface for v1-customers-customerId.
      operations:
      - method: GET
        name: getcustomer
        description: Avaloq Get Customer
        call: banking-customers.getcustomer
        with:
          customerId: rest.customerId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: banking-customers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Avaloq Banking API — Customers. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: avaloq-list-customers
      description: Avaloq List Customers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: banking-customers.listcustomers
      with:
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
    - name: avaloq-create-customer
      description: Avaloq Create Customer
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: banking-customers.createcustomer
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: avaloq-get-customer
      description: Avaloq Get Customer
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: banking-customers.getcustomer
      with:
        customerId: tools.customerId
      outputParameters:
      - type: object
        mapping: $.
