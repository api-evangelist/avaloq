specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Avaloq
providerId: avaloq
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
notes: Avaloq pricing is enterprise-quote and not publicly posted. This artifact models the FinOps
  shape of an Avaloq deployment (subscription + BPO + optional on-prem).
tags:
  - FinOps
  - FOCUS
  - Banking
  - Wealth Management
  - Core Banking
description: 'FOCUS-aligned FinOps for Avaloq: enterprise subscription core-banking platform with
  optional BPO services. Cost is dominated by platform license + per-AUM / per-account scale fees and
  BPO operations charges; not by per-API-call usage.'
sources:
  - https://www.avaloq.com/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Avaloq Group AG
serviceCategory: Core Banking / Wealth Management
billingModel:
  pricingCategory: Enterprise Subscription
  billingFrequency: Annual
  billingCurrency: USD/EUR/CHF
  chargeCategories:
    - Purchase
    - Usage
    - Adjustment
    - Tax
    - Credit
focusColumns:
  ServiceName: Avaloq
  ServiceCategory: Core Banking / Wealth Management
  ProviderName: Avaloq
  PublisherName: Avaloq Group AG
  InvoiceIssuerName: Avaloq Group AG
  BillingCurrency: CHF
meters:
  - name: banking_suite_license
    unit: month
    aggregation: sum
    dimensions:
      - module
      - deployment
  - name: client_accounts
    unit: account
    aggregation: max
  - name: assets_under_management
    unit: USD
    aggregation: max
  - name: bpo_operations
    unit: month
    aggregation: sum
    dimensions:
      - service
  - name: api_invocations
    unit: invocation
    aggregation: sum
    dimensions:
      - module
principles:
  - name: Visibility
    description: Visibility comes from the institution's own Avaloq instance — operations dashboards,
      Banking Suite reporting, and contractual scale reports tied to AUM / account counts.
  - name: Allocation
    description: Allocate by business unit (private banking, wealth, corporate), legal entity, and
      booking center. Avaloq supports multi-entity bookkeeping for chargeback.
  - name: Optimization
    description: Optimization levers are module mix (only license modules used), retiring legacy
      country / module deployments, and renegotiating BPO scope. API call patterns matter less than
      module footprint.
  - name: Accountability
    description: COO / Head of Operations or CIO typically owns the Avaloq relationship; multi-year
      contract reviews involve procurement and risk.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
