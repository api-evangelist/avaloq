provider: Avaloq
providerId: avaloq
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
notes: Avaloq does not publish public API rate limits. Limits are governed by the deployment contract
  (SaaS sizing or on-prem cluster sizing) and the institution's licensed throughput.
tags:
  - Banking
  - Wealth Management
  - Core Banking
  - Rate Limiting
description: Rate limit posture for the Avaloq API surface. Limits are enforced per-institution and
  scale with the deployed Banking Suite sizing; numeric thresholds live in the customer's deployment
  contract rather than on the public web.
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Avaloq API
    scope: institution
    metric: varies
    limit: see Avaloq deployment contract
    notes: Throughput is bounded by the licensed Banking Suite tier and host sizing. There is no public
      RPS table.
policies:
  - name: Backoff Strategy
    description: Implement exponential backoff with jitter on 429 / 503; honor Retry-After if present.
  - name: Deployment Contract Governs
    description: Sustained throughput must align with the institution's contracted Banking Suite sizing;
      capacity increases require a contract amendment.
  - name: Regulated Workload Discipline
    description: Most Avaloq calls touch regulated financial data; coordinate load tests with Avaloq
      ops to avoid impacting other tenants in shared SaaS deployments.
maintainers:
